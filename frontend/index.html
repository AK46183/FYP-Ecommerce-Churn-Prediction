<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/minaysh-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINAYSH — Beauty, Confidence, You</title>
    <meta name="description" content="MINAYSH is a premium beauty brand — makeup, skincare, fragrance and accessories designed to make beauty feel personal." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- MINAYSH_LOADER: opening screen (shows until the website is ready) -->
    <style>
      #min-loader {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse 60% 45% at 50% 48%, #2a1a20 0%, #150e11 55%, #0b0809 100%);
        color: #f3dccd; font-family: 'Inter', system-ui, sans-serif;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      #min-loader.is-done { opacity: 0; visibility: hidden; }
      #min-loader .ml-line { width: 50px; height: 1px; background: rgba(214, 160, 132, 0.45); margin-bottom: 56px; }
      #min-loader .ml-name {
        margin: 0; padding-left: 0.42em;
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        font-weight: 600; font-size: clamp(2.6rem, 7.5vw, 6.2rem); letter-spacing: 0.42em; line-height: 1;
        background: linear-gradient(100deg, #a8705a 0%, #d9a68a 30%, #fbe7da 50%, #d9a68a 70%, #a8705a 100%);
        background-size: 220% 100%;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: ml-shine 3.2s ease-in-out infinite, ml-rise 1.1s ease-out both;
      }
      #min-loader .ml-rule { width: 210px; max-width: 50vw; height: 1px; margin: 36px 0 26px;
        background: linear-gradient(90deg, transparent, rgba(214, 160, 132, 0.5), transparent); }
      #min-loader .ml-tag { margin: 0; padding-left: 0.5em; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.5em; color: rgba(232, 196, 176, 0.62); }
      #min-loader .ml-bar { position: relative; width: 175px; height: 1px; margin-top: 64px; background: rgba(214, 160, 132, 0.18); overflow: hidden; }
      #min-loader .ml-bar span { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #b9826a, #f0cdb8); transition: width 0.5s ease; }
      #min-loader .ml-load { margin: 22px 0 0; padding-left: 0.45em; font-size: 0.62rem; letter-spacing: 0.45em; color: rgba(232, 196, 176, 0.38); }
      @keyframes ml-shine { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0% 0; } }
      @keyframes ml-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #min-loader .ml-name { animation: none; } }
    </style>
  </head>
  <body>
    <div id="min-loader" role="status" aria-label="Loading MINAYSH">
      <div class="ml-line"></div>
      <div class="ml-name">MINAYSH</div>
      <div class="ml-rule"></div>
      <p class="ml-tag">BEAUTY · CONFIDENCE · YOU</p>
      <div class="ml-bar"><span></span></div>
      <p class="ml-load">LOADING</p>
    </div>
    <script>
      (function () {
        var el = document.getElementById('min-loader');
        var bar = el.querySelector('.ml-bar span');
        var start = Date.now(), p = 0, done = false;
        var tick = setInterval(function () { p = Math.min(88, p + (88 - p) * 0.12 + 1); bar.style.width = p + '%'; }, 120);
        function finish() {
          if (done) return; done = true;
          clearInterval(tick); bar.style.width = '100%';
          var wait = Math.max(0, 1600 - (Date.now() - start));
          setTimeout(function () {
            el.classList.add('is-done');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 900);
          }, wait + 350);
        }
        if (document.readyState === 'complete') finish(); else window.addEventListener('load', finish);
        setTimeout(finish, 7000); // never stay longer than 7 seconds
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
